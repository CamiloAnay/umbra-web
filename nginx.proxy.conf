# Single-origin deployment: nginx serves the built site and forwards the API
# under the same host.
#
# This is what the separate-services setup cannot do. With one origin there is
# no CORS to configure, VITE_API_URL becomes the relative /api/v1, and uploaded
# photographs are served from the same domain as the page that shows them.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Uploaded photographs can be large; the API caps them at 8 MB.
  client_max_body_size 10m;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;

  # Docker's embedded DNS. Resolving through a variable defers the lookup to
  # request time: with a plain upstream name, nginx resolves once at startup
  # and refuses to boot if the API container is not up yet, which turns a
  # slow-starting dependency into a dead web server.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream http://api:3001;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Image conversion takes a moment on a small machine.
    proxy_read_timeout 60s;
  }

  # Photographs uploaded through the panel, served by the API.
  location /uploads/ {
    set $uploads_upstream http://api:3001;
    proxy_pass $uploads_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Hashed build assets never change under the same name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Built-in photographs are not hashed, so they revalidate.
  location /img/ {
    expires 7d;
    add_header Cache-Control "public, must-revalidate";
  }

  # Single page: every unknown path returns the document.
  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
